<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <title>GGC - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/modernizr.js"></script>
    <style>
        .login-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 8rem 2rem;
            background: #fff;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 4rem;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            background: #fff;
        }
    </style>
</head>
<body id="top">
    <header class="s-header">
        <div class="header-logo">
            <a class="site-logo" href="index.html">
                <img src="images/logo.svg" alt="Homepage">
            </a>
        </div>
    </header>

    <section class="page-header page-header--events">
        <div class="gradient-overlay"></div>
        <div class="row page-header__content">
            <div class="column">
                <p class="subhead">Secure Access</p>
                <h1>Reset Password</h1>
            </div>
        </div>
    </section>

    <section class="login-wrap">
        <div class="login-card">
            <div class="dashboard-alert" id="dashboard-config-alert" hidden></div>
            <p id="reset-password-status" style="margin-bottom: 2rem; font-weight: 500;" role="status" aria-live="polite"></p>

            <form id="reset-password-form" class="dashboard-form" hidden>
                <label>
                    New Password
                    <input type="password" name="password" required minlength="6" autocomplete="new-password" class="h-full-width">
                </label>
                <label>
                    Confirm New Password
                    <input type="password" name="confirm-password" required minlength="6" autocomplete="new-password" class="h-full-width">
                </label>
                <button type="submit" class="btn btn--primary btn--large h-full-width">Save New Password</button>
            </form>

            <p style="margin-top: 3rem; text-align: center; font-size: 1.4rem;">
                <a href="login.html">Return to Admin Login</a>
            </p>
        </div>
    </section>

    <footer class="s-footer">
        <div class="row footer-bottom">
            <div class="column ss-copyright">
                <span>© Copyright God's Grace Center 2026</span>
                <span>263787155634</span>
            </div>
        </div>
    </footer>

    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
