    <meta name="description" content="">
    <meta name="author" content="">

    <!-- CSS

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- script
    ================================================== -->
    <script src="js/modernizr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- favicons
    ================================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

</head>

<body id="top" class="dashboard-page">

    <!-- preloader
    ================================================== -->
    <div id="preloader">
        <div id="loader" class="dots-jump">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- header
    ================================================== -->
    <header class="s-header">

        <div class="header-logo">
            <a class="site-logo" href="index.html">
                <img src="images/logo.svg" alt="Homepage">
            </a>
        </div>

        <nav class="header-nav-wrap">
            <ul class="header-nav">
                <li><a href="index.html" title="Home">Home</a></li>
                <li><a href="about.html" title="About">About</a></li>
                <li><a href="events.html" title="Services">Events & Services</a></li>
                <li class="current"><a href="dashboard.html" title="Dashboard">Dashboard</a></li>
                <li><a href="contact.html" title="Contact us">Contact</a></li>
                
            </ul>
        </nav>

        <a class="header-menu-toggle" href="#0"><span>Menu</span></a>

    </header> <!-- end s-header -->

    <!-- page header
    ================================================== -->
    <section class="page-header page-header--events">

        <div class="gradient-overlay"></div>
        <div class="row page-header__content">
            <div class="column">
                <p class="subhead dashboard-subhead">Admin only</p>
                <h1>Event Dashboard</h1>
                <p class="dashboard-header-copy">Create, edit, and publish events from our calendar.</p>
            </div>
        </div>

    </section> <!-- end page-header -->

    <!-- page content
    ================================================== -->
    <section class="page-content page-content--dashboard">

        <div class="row dashboard-layout">
            <div class="column large-8 tab-full">
                <section class="dashboard-panel dashboard-panel--calendar">
                    <div class="dashboard-panel__head">
                        <div>
                            <p class="subhead">Calendar</p>
                            <h2 class="h3">Click a day to add an event</h2>
                        </div>
                        <button class="btn btn--stroke dashboard-action" type="button" id="dashboard-add-event">Add Event</button>
                    </div>
                    <div id="dashboard-calendar" class="dashboard-calendar"></div>
                </section>
            </div>

            <div class="column large-4 tab-full">
                <section class="dashboard-panel">
                    <div class="dashboard-panel__head dashboard-panel__head--stacked">
                        <p class="subhead">Event editor</p>
                        <h2 class="h3" id="event-form-heading">New Event</h2>
                    </div>

                    <p class="dashboard-status" id="dashboard-status" aria-live="polite"></p>

                    <form id="event-form" class="dashboard-form">
                        <input type="hidden" id="event-id" name="id">
                        <label>
                            Title
                            <input type="text" id="event-title" name="title" required maxlength="150">
                        </label>
                        <div class="dashboard-form__grid">
                            <label>
                                Start Date
                                <input type="date" id="event-start-date" name="startDate" required>
                            </label>
                            <label>
                                Start Time
                                <input type="time" id="event-start-time" name="startTime">
                            </label>
                        </div>
                        <div class="dashboard-form__grid">
                            <label>
                                End Date
                                <input type="date" id="event-end-date" name="endDate">
                            </label>
                            <label>
                                End Time
                                <input type="time" id="event-end-time" name="endTime">
                            </label>
                        </div>
                        <label>
                            Location
                            <input type="text" id="event-location" name="location" maxlength="200">
                        </label>
                        <label>
                            Description
                            <textarea id="event-description" name="description" rows="5"></textarea>
                        </label>
                        <label class="dashboard-check">
                            <input type="checkbox" id="event-all-day" name="allDay">
                            All day event
                        </label>
                        <label class="dashboard-check">
                            <input type="checkbox" id="event-published" name="isPublished" checked>
                            Published
                        </label>

                        <div class="dashboard-form__actions">
                            <button type="submit" class="btn btn--primary">Save Event</button>
                            <button type="button" class="btn btn--stroke" id="event-clear">Clear</button>
                            <button type="button" class="btn btn--stroke dashboard-danger" id="event-delete" disabled>Delete</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>

    </section> <!-- end page content -->

    <!-- footer
    ================================================== -->
    <footer class="s-footer">

        <div class="row footer-bottom">
            <div class="column ss-copyright">
                <span>263787155634</span>
                <span>©GGCMEDIA2026</span>
                <span>Admin dashboard</span>
                <div id="dashboard-session" hidden style="display: inline-block; margin-left: 2rem;">
                    <span id="dashboard-session-email" style="margin-right: 1rem; opacity: 0.7;"></span>
                    <button type="button" id="dashboard-sign-out" style="padding: 0; background: none; border: none; color: #037c82; cursor: pointer; text-decoration: underline; font-size: 1.2rem;">Sign Out</button>
                </div>
                <div class="dashboard-alert" id="dashboard-config-alert" hidden></div>
            </div>
        </div>

    </footer> <!-- end s-footer -->

    <!-- Java Script
    ================================================== -->
    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/dashboard.js"></script>

</body>
</html>
